name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.0.8"

      - name: Cache nimble
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-${{ hashFiles('skybook.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Build frontend
        run: |
          mkdir -p frontend
          nim js src/frontend/app.nim
          cp src/frontend/app.js frontend/
          cp src/frontend/style.css frontend/
          cp src/frontend/app.html frontend/

      - name: Build backend
        run: |
          nimble install -y
          cp "$HOME/.nimble/bin/skybook" skybook

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: skybook-${{ matrix.os == 'ubuntu-latest' && 'linux' || 'macos' }}
          path: skybook

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mv artifacts/skybook-linux/skybook skybook-linux
          mv artifacts/skybook-macos/skybook skybook-macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            skybook-linux
            skybook-macos
          generate_release_notes: true
